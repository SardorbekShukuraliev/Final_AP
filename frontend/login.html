<!-- frontend/login.html -->
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Biteplate SRMS – Вход</title>
    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f5f5f5;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            background: #eee;
            border: 1px solid #ccc;
        }

        .tab.active {
            background: white;
            border-bottom: none;
            font-weight: bold;
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        label,
        input,
        select,
        button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Biteplate SRMS</h2>
        <div class="tabs">
            <div class="tab active" onclick="showTab('login')">Вход</div>
            <div class="tab" onclick="showTab('register')">Регистрация</div>
        </div>

        <div id="login-form" class="form active">
            <label>Логин:</label>
            <input type="text" id="login-username" placeholder="admin">
            <label>Пароль:</label>
            <input type="password" id="login-password" placeholder="admin">
            <button onclick="login()">Войти</button>
            <p id="login-error" class="error"></p>
        </div>

        <div id="register-form" class="form">
            <label>Логин:</label>
            <input type="text" id="reg-username">
            <label>Пароль:</label>
            <input type="password" id="reg-password">
            <label>Роль:</label>
            <select id="reg-role">
                <option value="client">Клиент</option>
                <option value="waiter">Официант</option>
                <option value="chef">Шеф-повар</option>
                <option value="admin">Администратор</option>
            </select>
            <button onclick="register()">Зарегистрироваться</button>
            <p id="reg-error" class="error"></p>
        </div>
    </div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        function redirectByRole(token, role) {
            // Очищаем ВСЕ предыдущие данные другого аккаунта
            localStorage.clear();
            // Записываем новые
            localStorage.setItem('token', token);
            localStorage.setItem('role', role);
            const pages = {
                client: '/client.html',
                waiter: '/waiter.html',
                chef: '/chef.html',
                admin: '/admin.html'
            };
            window.location.href = pages[role] || '/client.html';
        }

        async function login() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const err = document.getElementById('login-error');
            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    err.innerText = data.detail || 'Ошибка входа';
                    return;
                }
                const data = await resp.json();
                redirectByRole(data.token, data.role);
            } catch (e) {
                err.innerText = 'Сетевая ошибка';
            }
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const err = document.getElementById('reg-error');
            try {
                const resp = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    err.innerText = data.detail || 'Ошибка регистрации';
                    return;
                }
                alert('Регистрация успешна! Теперь войдите.');
                showTab('login');
                document.getElementById('login-username').value = username;
            } catch (e) {
                err.innerText = 'Сетевая ошибка';
            }
        }
    </script>
</body>

</html>
